name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Configure
        # The preset pins the VS 2026 generator; fall back to whatever VS the runner has.
        run: cmake -S . -B build/ci -A x64 -DENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }}
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ninja-gcc, ninja-clang]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Ninja and SDL build dependencies
        # SDL's configure fails without X11 headers, and also for each X11 extension it
        # enables by default (Xcursor, Xi, Xfixes, Xrandr, XScrnSaver, Xtest; Xdbe, Xsync and
        # Xshape come with Xext). ALSA and PulseAudio give the game sound on Linux; without
        # them SDL builds with no audio backend and the game plays silently. Wayland and the
        # rest are optional and skipped.
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build
          libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev
          libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The sparse-set and hook code has aliasing and lifetime risk; ASan and UBSan catch it at
  # run time. Findings abort the test run (-fno-sanitize-recover).
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Ninja and SDL build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build
          libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev
          libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev
      - name: Configure
        run: cmake --preset ninja-asan
      - name: Build
        run: cmake --build --preset ninja-asan
      - name: Test
        run: ctest --preset ninja-asan

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Ninja, clang-tidy and SDL build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy
          libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev
          libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev
      - name: Configure
        run: cmake --preset ninja-clang
      - name: Build
        # Builds SDL and generates any headers the analysis needs.
        run: cmake --build --preset ninja-clang
      - name: clang-tidy
        # Our own sources only; .clang-tidy limits header diagnostics the same way.
        run: >-
          run-clang-tidy -p build/ninja-clang -quiet
          '^.*/(engine|game)/src/.*\.cpp$'
