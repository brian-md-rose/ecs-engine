name: Release

# Publishes a GitHub release when a version tag such as v0.2.0 is pushed.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches CMakeLists.txt
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -n '/^project(EcsEngine/,/)/s/.*VERSION *\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [ "$tag" != "$cmake_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $cmake_version" >&2
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $tag" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
