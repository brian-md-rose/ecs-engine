name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and fork PRs (they can't read repo secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Set one of these repo secrets; the other can stay unset.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to a C++ ECS game engine. Read CLAUDE.md for project facts.
            Focus on, most important first:
            - Correctness bugs: lifetime and dangling references, iterator invalidation when
              components or entities are added or removed, off-by-one errors, uninitialized members.
            - Code that would fail CI: CI builds MSVC (Debug and Release), GCC and Clang with
              warnings as errors (/Wall /WX /analyze, -Wshadow -Wconversion and more), so flag
              narrowing conversions, shadowed names, unused variables and missing field initializers.
            - Missing or weak tests for new behaviour.
            - Performance problems in per-frame code paths.
            Skip style nits that clang-format handles.

            Use mcp__github_inline_comment__create_inline_comment for specific lines, then post
            one short summary with `gh pr comment`. If there's nothing worth raising, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
