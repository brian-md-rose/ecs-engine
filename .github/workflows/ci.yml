name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Configure
        # The preset pins the VS 2026 generator; fall back to whatever VS the runner has.
        run: cmake -S . -B build/ci -A x64 -DENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }}
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ninja-gcc, ninja-clang]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install Ninja and SDL build dependencies
        # SDL's configure fails without X11 headers, and also for each X11 extension it
        # enables by default (Xcursor, Xi, Xfixes, Xrandr, XScrnSaver, Xtest; Xdbe, Xsync and
        # Xshape come with Xext). Audio, Wayland and the rest are optional and skipped.
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build
          libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev
          libxrandr-dev libxss-dev libxtst-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
